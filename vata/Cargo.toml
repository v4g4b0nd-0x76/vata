[package]
name = "vata"
version = "0.1.0"
edition = "2024"

[features]
telemetry = []
xdp = ["dep:aya", "dep:xdp"]
non_temporal_writes = []
udp_listener = []

[dependencies]
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
tikv-jemallocator = "0.6"
tokio = { version = "1.52.3", default-features = false, features = [
    "rt",
    "process",
    "fs",
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }
toml = "1.1.6"

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.14", optional = true }
xdp = { version = "0.8", optional = true }

[build-dependencies]
aya-build = "0.2.0"
[[bench]]
name = "arena_bench"
harness = false

[[bench]]
name = "arena_workload"
harness = false

[[bench]]
name = "udp_workload"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
